[package]
name = "spareline"
description = "Spare phone lines on spare phones, with an inbox for each line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spareline"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["std", "help", "usage", "error-context"] }
spareline_adb = { path = "../spareline_adb" }
spareline_core = { path = "../spareline_core" }
spareline_db = { path = "../spareline_db" }
spareline_server = { path = "../spareline_server" }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "io-util"] }

[lints]
workspace = true
