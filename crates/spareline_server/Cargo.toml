[package]
name = "spareline_server"
description = "The running spareline service: its HTTP API, phone manager, text ingest, monitor and screens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "ws"] }
futures-util = { workspace = true, features = ["std"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
spareline_adb = { path = "../spareline_adb" }
spareline_core = { path = "../spareline_core" }
spareline_db = { path = "../spareline_db" }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
regex.workspace = true
rusqlite.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = [
    "io-util",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "test-util",
    "time",
] }

[lints]
workspace = true
