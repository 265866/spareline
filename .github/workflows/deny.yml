name: Advisories

# Advisories come out at any time, so this runs `just deny` weekly as well as on every pull request
# through CI, and flags a new one on `main` before a pull request trips over it.
# It also runs `just stale-licenses`, which flags an entry in about.toml for a crate that has left
# the graph: `just notices` lets such an entry through, so a license can be accepted before its
# crate.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: just@1.59.0,cargo-deny@0.20.2,cargo-about@0.9.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: just deny
      - run: just stale-licenses
        if: ${{ !cancelled() }}
