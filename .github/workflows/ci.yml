name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun scripts/check-private.ts
      # shellcheck is preinstalled on the Ubuntu runners.
      - run: shellcheck -x -P SCRIPTDIR -s bash deploy/podman/*.sh
