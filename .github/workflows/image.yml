name: Image

# Builds only commits on main that passed CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-main
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    # Native arm64; the amd64 image runs its few final-stage steps under QEMU,
    # since the web bundle is built once, natively.
    runs-on: ubuntu-24.04-arm
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ghcr.io rejects uppercase image paths.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # A re-run of CI for an older commit must not move :main backwards.
      - name: Tags
        id: tags
        env:
          NAME: ${{ steps.image.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          {
            echo "list<<EOF"
            echo "${NAME}:sha-${SHA}"
            if [ "$head" = "$SHA" ]; then echo "${NAME}:main"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            REVISION=${{ env.SHA }}
          tags: ${{ steps.tags.outputs.list }}
